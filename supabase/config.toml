project_id = "ahla-shabab-management-os-v8"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Seed files are listed explicitly and concatenated natively by the Supabase CLI.
# NOTE: the legacy root seed.sql used psql `\ir` include meta-commands, which the
# CLI's driver-based seeder (v2.x) cannot parse (syntax error at "\"). Listing the
# plain-SQL files here is the supported mechanism. Files remain idempotent.
[db.seed]
enabled = true
sql_paths = ["./seed/0001_seed_permissions_roles.sql", "./seed/0002_seed_used_permissions.sql"]

# Disabled: the Logflare/Analytics stack (and its `vector` log shipper) requires
# the Docker daemon exposed on tcp://localhost:2375, which does not work reliably
# with WSL2 mirrored networking on Windows. Not needed for local development.
[analytics]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# Local dev serves the web app on 4173. On the hosted (staging/prod) project the
# Site URL MUST be the deployed origin (https://ahla-shabab-management-os.vercel.app),
# NOT localhost — otherwise password-recovery / invite emails point at a dead
# localhost port and "This site can't be reached" appears when the employee
# clicks the activation link. site_url is env-driven so `supabase config push`
# can set the remote value (export SUPABASE_AUTH_SITE_URL=<vercel>) while local
# `supabase start` keeps the localhost default.
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# SEC: strict allowlist. Wildcards ("/**") let attackers redirect recovery links
# to attacker-controlled sub-paths. List the exact routes that legitimately
# receive auth tokens: the mobile deep-link hand-off and the password-setup form.
additional_redirect_urls = [
  "http://localhost:4173/auth/setup-password",
  "http://127.0.0.1:4173/auth/setup-password",
  "http://localhost:4173/mobile-redirect",
  "http://127.0.0.1:4173/mobile-redirect",
  "https://ahla-shabab-management-os.vercel.app/auth/setup-password",
  "https://ahla-shabab-management-os.vercel.app/mobile-redirect",
  "ahlashabab://action",
]
jwt_expiry = 3600
# SEC: account creation is exclusively driven by `admin-create-employee` /
# `admin-resend-invite` Edge Functions using the service role. Public signup
# MUST stay disabled — anyone holding the publishable key + project URL could
# otherwise mint accounts and probe `handle_new_user` / RLS for weaknesses.
# Password sign-IN does not require signup to be enabled; existing users still
# authenticate with signInWithPassword.
enable_signup = false
enable_anonymous_sign_ins = false
# Passwords shorter than this value are rejected. Supabase requires at least 6.
# HR-issued initial passwords are validated server-side (12+ chars, mixed
# alphabet + digit + symbol) before reaching GoTrue; this is the bare floor.
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
# SEC: even though every account created by HR has email_confirm=true (so the
# employee can sign in immediately), we keep confirmation infrastructure on so
# future flows (self-serve password change, delegated admin onboarding) get a
# verified channel instead of unverified plaintext mail.
enable_confirmations = true
# SEC: credentials carried by recovery/invite links must be short-lived. The
# platform previously relied on Supabase's 24h default, which is far too wide a
# window for an HR onboarding link. 1 hour forces the link to be used promptly
# or have HR resend — the resend path is already rate-limited via
# auth_invite_log.
otp_expiry = 3600
secure_password_change = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.verify-attendance-punch]
verify_jwt = true

[functions.webauthn-challenge]
verify_jwt = true

[functions.admin-create-employee]
verify_jwt = true

[functions.admin-resend-invite]
verify_jwt = true

[functions.admin-set-password]
verify_jwt = true

[functions.passkey-register]
verify_jwt = true

[functions.scheduled-report-runner]
verify_jwt = false

[functions.notification-dispatcher]
verify_jwt = false

[functions.retention-cleanup]
verify_jwt = false

[functions.integration-outbox-worker]
verify_jwt = false

[functions.identifier-sign-in]
verify_jwt = false

[functions.live-location-map-url]
verify_jwt = true
