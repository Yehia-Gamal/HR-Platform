name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin_web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build --workspace @ahla/admin-web

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          # قيم عامة (project URL + publishable/anon key) — آمنة للنشر في الواجهة
          VITE_SUPABASE_URL: https://ujzzvqsodyhnnnpkoaml.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Q5JTOX-mLp5Y9wmxlZyTnQ_QBu5wPC2
          VITE_ENABLE_DEV_MOCKS: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin_web/playwright-report/
          retention-days: 14
