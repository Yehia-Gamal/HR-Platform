name: Supabase database CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # تخفيف Docker Hub rate limit عند توفر التوكنات (اختياري — يُتجاهل بلا أسرار)
      - name: Docker Hub login
        continue-on-error: true
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      # استثناء خدمات غير لازمة لاختبارات pgTAP — toomanyrequests أوقع الجوب
      # مراراً على runners ذات IP مشترك، والاستثناءات تقلل السحب وتسرّع الإقلاع.
      # edge-runtime مستثنى تحديداً: حزم الدوال تتطلب packages/shared-contracts/dist
      # المبني، وdatabase job لا يبنيه (edge-smoke يبنيه صراحة)
      # مع 3 محاولات وتراجع 90 ثانية لامتصاص Docker Hub rate-limit العابر
      - name: Start Supabase
        run: |
          for i in 1 2 3; do
            if npx supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,supavisor,edge-runtime; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt $i) — likely Docker Hub rate limit; backing off"
            sleep 90
          done
          exit 1
      # Reset + test twice: proves the build is repeatable from an empty
      # database and does not depend on leftover state (plan gate P0.3).
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db reset
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # contracts.ts يجسر إلى packages/shared-contracts/dist — يحتاج npm + بناء
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ahla/shared-contracts
      - uses: denoland/setup-deno@v2
        with:
          # مثبَّت — v2.x العائم جلب إصداراً جديدًا كسر deno check في CI (2026-08-20)
          deno-version: 2.9.5
      # يلتقط أخطاء الصياغة والاستيراد والأنواع في كل الدوال الخادمية قبل النشر.
      - run: deno check supabase/functions/*/index.ts
      # يشغّل اختبارات الوحدة للدوال الخادمية (تطبيع الهاتف وغيرها).
      - run: deno test supabase/functions/
