name: Supabase database CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      # Reset + test twice: proves the build is repeatable from an empty
      # database and does not depend on leftover state (plan gate P0.3).
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db reset
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup
