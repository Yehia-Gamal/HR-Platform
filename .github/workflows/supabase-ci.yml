name: Supabase database CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      # Reset + test twice: proves the build is repeatable from an empty
      # database and does not depend on leftover state (plan gate P0.3).
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db reset
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # يلتقط أخطاء الصياغة والاستيراد والأنواع في كل الدوال الخادمية قبل النشر.
      - run: deno check supabase/functions/*/index.ts
      # يشغّل اختبارات الوحدة للدوال الخادمية (تطبيع الهاتف وغيرها).
      - run: deno test supabase/functions/
