name: Deploy web to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  # بوابة ما قبل النشر (تدقيق 0524).
  # قبلها كانت وظيفة deploy تعمل مباشرة على كل push إلى main بلا أي اعتماد
  # على web-ci أو security-ci، فكان يكفي فشل اختبار أو نوع ليُنشر إلى الإنتاج.
  # نُكرّر الفحوص هنا بدل workflow_run لأن workflow_run يُطلق عند اكتمال
  # سير عمل واحد لا عند نجاح الثلاثة معاً.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check = no-bom + typecheck + build contracts + test + build
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:secrets
      - run: node scripts/validate-foundation.mjs
      - run: node scripts/check-migrations-integrity.mjs

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
