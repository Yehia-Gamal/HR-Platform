name: Edge Smoke Tests

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        # مثبَّت — الإصدارات الأحدث (2.115+) تكسر supabase start في بيئة نظيفة
        run: npm install -g supabase@2.111.0

      # contracts.ts يجسر إلى packages/shared-contracts/dist — يجب بناؤه
      # قبل functions serve وإلا فشل تحميل الدوال
      - name: Build shared contracts
        run: |
          npm ci
          npm run build --workspace @ahla/shared-contracts

      - name: Start Supabase
        run: |
          npx supabase start
          echo "Waiting for services to be ready..."
          sleep 10

      - name: Get Supabase keys
        id: keys
        run: |
          echo "ANON_KEY=$(npx supabase status -o json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "BASE_URL=$(npx supabase status -o json | jq -r '.API_URL')/functions/v1" >> $GITHUB_OUTPUT

      - name: Serve Edge Functions
        run: |
          # LOGIN_HASH_PEPPER سري محلي — يولَّد عشوائياً لكل تشغيل (لا يُكتب في المستودع)
          echo "LOGIN_HASH_PEPPER=$(openssl rand -hex 32)" > supabase/functions/.env
          echo "DENO_ENV=local" >> supabase/functions/.env
          npx supabase functions serve &
          sleep 5

      - name: Run smoke tests
        run: |
          chmod +x scripts/edge-smoke-tests.sh
          BASE_URL="${{ steps.keys.outputs.BASE_URL }}" \
          ANON_KEY="${{ steps.keys.outputs.ANON_KEY }}" \
          bash scripts/edge-smoke-tests.sh

      - name: Stop Supabase
        if: always()
        run: npx supabase stop
